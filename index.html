
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PAIN PAYS ULTIMATE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c101b;color:white;font-family:Arial;overflow:hidden}
header{height:58px;background:#171e2d;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:2px solid #303c52}
.logo{font-size:22px;font-weight:1000;color:#ffbd3c}
.money{color:#ffda55;font-weight:bold}
nav{height:46px;display:flex;overflow-x:auto;background:#202a3c;gap:4px;padding:5px}
button{border:0;border-radius:8px;padding:10px 12px;background:#34425b;color:white;font-weight:bold;white-space:nowrap;cursor:pointer}
button:active{transform:scale(.96)}
button.selected{background:#ffb52e;color:#171717}
button.green{background:#168b60}
button.red{background:#b93648}
#arena{height:calc(100dvh - 195px);min-height:180px;display:block;width:100%;touch-action:none;background:#182337}
#toolbar{height:91px;background:#151c2a;padding:6px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px}
#toolbar button{font-size:12px;padding:9px}
#status{height:24px;text-align:center;color:#ffcf68;font-size:12px;padding:4px}
#panel{display:none;position:absolute;z-index:5;inset:60px 5px 105px;background:#171f30;border:2px solid #52617b;border-radius:14px;padding:12px;overflow:auto}
#panel h2{color:#ffbd3c;margin:5px 0 12px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.item{background:#263249;padding:11px;border-radius:10px;min-height:83px}
.item b{color:#ffd16b}
.item p{font-size:12px;color:#c1ccdf;margin:6px 0}
.item button{margin-top:5px}
#close{float:right;background:#9c3445}
#hint{font-size:11px;color:#9daac1}
</style>
</head>
<body>
<header>
 <div class="logo">💀 PAIN PAYS</div>
 <div class="money" id="money">🪙 0</div>
</header>

<nav>
 <button onclick="openPanel('shop')">🛒 SHOP</button>
 <button onclick="openPanel('maps')">🌍 MAPS</button>
 <button onclick="openPanel('characters')">🧍 CHARACTERS</button>
 <button onclick="openPanel('missions')">🎯 MISSIONS</button>
 <button onclick="openPanel('upgrades')">⬆ UPGRADES</button>
 <button onclick="openPanel('achievements')">🏆 TROPHIES</button>
</nav>

<canvas id="arena"></canvas>
<div id="status">BUILD YOUR OWN CHAOS! Select a trap and tap the arena.</div>
<div id="toolbar">
 <button id="buildBtn" class="selected" onclick="setMode('build')">🔨 BUILD</button>
 <button id="playBtn" class="green" onclick="play()">▶ PLAY</button>
 <button onclick="pause()">⏸ PAUSE</button>
 <button onclick="reset()">↻ RESET</button>
 <button onclick="spawn()">🧍 SPAWN</button>
 <button onclick="clearAll()">🗑 CLEAR</button>
 <button onclick="openPanel('shop')">+ TRAPS</button>
</div>

<div id="panel">
 <button id="close" onclick="closePanel()">CLOSE ✕</button>
 <div id="panelContent"></div>
</div>

<script>
const canvas=document.getElementById("arena");
const ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status");

let W=800,H=500;
let mode="build",running=false;
let coins=Number(localStorage.getItem("ppcoins")||0);
let objects=[],people=[],particles=[];
let selected="bumper";
let currentMap="warehouse";
let character=0;
let power=1;
let totalHits=0,totalCoins=0;
let completed={};
let owned=["bumper","spring","spikes","wall"];
let ownedCharacters=[0];
let achievements={};
let frame=0;

const traps=[
 ["bumper","🔵","Bumper",20,"Bounces the ragdoll"],
 ["spring","🟢","Super spring",35,"Launches the ragdoll"],
 ["spikes","🔺","Spike trap",50,"A painful collision"],
 ["wall","🧱","Steel wall",25,"A solid obstacle"],
 ["saw","⚙️","Spinning saw",100,"Dangerous rotating blade"],
 ["cannon","💣","Cannon",150,"Launches the ragdoll"],
 ["mine","💥","Explosive mine",120,"Creates a big explosion"],
 ["trampoline","🟣","Trampoline",80,"Huge bounce"],
 ["crusher","⬇️","Crusher",180,"Slams down from above"],
 ["laser","🔴","Laser",200,"A dangerous laser beam"],
 ["fan","🌀","Air fan",90,"Pushes the ragdoll"],
 ["barrel","🛢️","Explosive barrel",140,"Explodes when hit"],
 ["magnet","🧲","Magnet",110,"Pulls nearby ragdolls"],
 ["fire","🔥","Fire burner",160,"A fiery hazard"],
 ["teleporter","🌀","Teleporter",250,"Moves the ragdoll"]
];

const maps=[
 ["warehouse","🏭","Warehouse"],
 ["factory","⚙️","Factory"],
 ["laboratory","🧪","Laboratory"],
 ["city","🏙️","City"],
 ["space","🚀","Space"]
];

const characters=[
 ["Classic","🟠",0],
 ["Blue Pilot","🔵",100],
 ["Robot","🤖",250],
 ["Alien","👽",400],
 ["Golden Dummy","🟡",750]
];

function save(){
 localStorage.setItem("ppcoins",coins);
 localStorage.setItem("ppowned",JSON.stringify(owned));
 localStorage.setItem("ppchars",JSON.stringify(ownedCharacters));
 localStorage.setItem("ppachievements",JSON.stringify(achievements));
 localStorage.setItem("ppcompleted",JSON.stringify(completed));
 localStorage.setItem("ppmap",currentMap);
 localStorage.setItem("ppcharacter",character);
 localStorage.setItem("pppower",power);
}
try{
 owned=JSON.parse(localStorage.getItem("ppowned"))||owned;
 ownedCharacters=JSON.parse(localStorage.getItem("ppchars"))||ownedCharacters;
 achievements=JSON.parse(localStorage.getItem("ppachievements"))||{};
 completed=JSON.parse(localStorage.getItem("ppcompleted"))||{};
 currentMap=localStorage.getItem("ppmap")||currentMap;
 character=Number(localStorage.getItem("ppcharacter")||0);
 power=Number(localStorage.getItem("pppower")||1);
}catch(e){}

function updateMoney(){
 document.getElementById("money").textContent="🪙 "+coins;
 save();
}
updateMoney();

function resize(){
 const r=canvas.getBoundingClientRect();
 W=r.width;H=r.height;
 canvas.width=Math.round(W*devicePixelRatio);
 canvas.height=Math.round(H*devicePixelRatio);
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener("resize",resize);
resize();

function setMode(m){
 mode=m;
 running=false;
 document.getElementById("buildBtn").classList.toggle("selected",m==="build");
 document.getElementById("playBtn").classList.toggle("selected",m==="play");
 statusEl.textContent=m==="build"?
 "BUILD MODE: Select an object, then tap to place it.":
 "PLAY MODE: Press PLAY to release the ragdoll.";
}

function place(type,x,y){
 if(!owned.includes(type)){
 statusEl.textContent="Buy this trap in the shop first!";
 return;
 }
 objects.push({type,x,y,angle:0,used:false});
 statusEl.textContent="Placed "+type.toUpperCase()+"!";
}

canvas.addEventListener("pointerdown",e=>{
 if(mode!=="build"||running)return;
 const r=canvas.getBoundingClientRect();
 place(selected,e.clientX-r.left,e.clientY-r.top);
});

function makePerson(){
 const x=W*.5,y=55;
 const colors=["#f1b45e","#4ca7ff","#b2b8c8","#9bdf7a","#ffd54a"];
 const c=colors[character]||colors[0];
 const p=[
 [x,y,12],[x,y+25,9],
 [x-17,y+30,6],[x-32,y+52,5],
 [x+17,y+30,6],[x+32,y+52,5],
 [x,y+60,8],[x-12,y+79,7],[x-15,y+109,6],
 [x+12,y+79,7],[x+15,y+109,6]
 ].map(a=>({x:a[0],y:a[1],ox:a[0]-1,oy:a[1],r:a[2]}));
 const links=[[0,1,25],[1,2,22],[2,3,25],[1,4,22],[4,5,25],[1,6,35],[6,7,24],[7,8,29],[6,9,24],[9,10,29],[2,4,34],[7,9,24]];
 people.push({p,links,c,alive:true,damage:0});
}

function spawn(){
 makePerson();
 running=false;
 mode="build";
 statusEl.textContent="RAGDOLL SPAWNED! Press PLAY.";
}

function play(){
 if(!people.length)makePerson();
 running=true;
 mode="play";
 statusEl.textContent="LET THE CHAOS BEGIN!";
}

function pause(){
 running=false;
 statusEl.textContent="PAUSED";
}

function reset(){
 running=false;
 people=[];
 particles=[];
 totalHits=0;
 statusEl.textContent="Reset! Spawn a new ragdoll.";
}

function clearAll(){
 if(running)return;
 objects=[];
 statusEl.textContent="Arena cleared!";
}

function award(amount,x,y){
 coins+=amount;
 totalCoins+=amount;
 totalHits++;
 updateMoney();
 particles.push({x,y,life:35,amount});
 statusEl.textContent="💥 COLLISION! +"+amount+" COINS!";
 checkAchievements();
}

function explode(x,y){
 for(const p of people){
 for(const b of p.p){
 const dx=b.x-x,dy=b.y-y;
 const d=Math.hypot(dx,dy)||1;
 if(d<145){
 b.ox=b.x+(dx/d)*18;
 b.oy=b.y+(dy/d)*18;
 }
 }
 }
 for(let i=0;i<24;i++){
 const a=Math.random()*Math.PI*2;
 particles.push({x,y,vx:Math.cos(a)*5,vy:Math.sin(a)*5,life:35,amount:0});
 }
 award(30,x,y);
}

function hit(p,x,y,amount=1){
 const t=performance.now();
 if(t-(p.lastHit||0)<220)return;
 p.lastHit=t;
 p.damage+=amount;
 award(Math.round(5*amount*power),x,y);
}

function physicsPerson(person){
 const p=person.p;
 const g=currentMap==="space"?.12:.42;

 for(const b of p){
 const vx=(b.x-b.ox)*.99;
 const vy=(b.y-b.oy)*.99;
 b.ox=b.x;b.oy=b.y;
 b.x+=vx;b.y+=vy+g;
 }
 for(let k=0;k<6;k++){
 for(const l of person.links){
 const a=p[l[0]],b=p[l[1]];
 const dx=b.x-a.x,dy=b.y-a.y;
 const d=Math.hypot(dx,dy)||1;
 const e=(d-l[2])/d*.5;
 a.x+=dx*e;a.y+=dy*e;
 b.x-=dx*e;b.y-=dy*e;
 }
 }

 for(const b of p){
 if(b.x<b.r){b.x=b.r;b.ox=b.x+5;hit(person,b.x,b.y)}
 if(b.x>W-b.r){b.x=W-b.r;b.ox=b.x-5;hit(person,b.x,b.y)}
 if(b.y>H-b.r-10){
 b.y=H-b.r-10;
 const speed=Math.abs(b.y-b.oy);
 b.oy=b.y- (speed>4?5:0);
 if(speed>4)hit(person,b.x,b.y);
 }
 if(b.y<b.r){b.y=b.r;b.oy=b.y+2}

 for(const o of objects){
 const dx=b.x-o.x,dy=b.y-o.y;
 const d=Math.hypot(dx,dy)||1;
 let rad=27;
 if(o.type==="wall"||o.type==="crusher")rad=33;
 if(o.type==="saw"||o.type==="fire")rad=24;

 if(o.type==="wall"){
 if(Math.abs(dx)<30&&Math.abs(dy)<33){
 b.x+=dx>=0?3:-3;
 b.ox=b.x-(dx>=0?4:-4);
 if(Math.abs(b.x-b.ox)>2)hit(person,b.x,b.y);
 }
 }else if(o.type==="fan"){
 if(d<180){b.ox-=0.7;b.oy+=0.2;}
 }else if(o.type==="magnet"){
 if(d<180){b.ox+=(dx/d)*1.1;b.oy+=(dy/d)*1.1;}
 }else if(o.type==="teleporter"){
 if(d<rad+b.r&&!o.used){
 o.used=true;
 b.x=W*.8;b.y=70;b.ox=b.x-3;b.oy=b.y;
 hit(person,b.x,b.y,3);
 }
 }else if(o.type==="laser"){
 if(Math.abs(dy)<7&&dx>-35&&dx<35){
 b.oy=b.y-6;hit(person,b.x,b.y,2);
 }
 }else if(o.type==="crusher"){
 if(Math.abs(dx)<30&&Math.abs(dy)<30){
 b.oy=b.y-8;hit(person,b.x,b.y,2);
 }
 }else if(d<rad+b.r){
 if(o.type==="mine"||o.type==="barrel"){
 if(!o.used){o.used=true;explode(o.x,o.y);}
 }else{
 const nx=dx/d,ny=dy/d;
 b.x=o.x+nx*(rad+b.r);
 b.y=o.y+ny*(rad+b.r);
 let vx=b.x-b.ox,vy=b.y-b.oy;
 let bounce=1.5;
 if(o.type==="spring")bounce=2.4;
 if(o.type==="trampoline")bounce=3.2;
 if(o.type==="cannon")bounce=3.8;
 if(o.type==="spikes"||o.type==="saw"||o.type==="fire")bounce=2.2;
 b.ox=b.x-vx*bounce;
 b.oy=b.y-vy*bounce;
 hit(person,b.x,b.y,o.type==="spikes"?3:1);
 if(o.type==="cannon"){b.ox-=nx*14;b.oy-=ny*14;}
 if(o.type==="saw"||o.type==="spikes"||o.type==="fire")person.damage+=2;
 }
 }
 }
 }
}

function drawBackground(){
 const backgrounds={
 warehouse:["#1a293b","#304258"],
 factory:["#292a32","#46414a"],
 laboratory:["#142e3c","#24526a"],
 city:["#17263b","#34415b"],
 space:["#080e28","#171e43"]
 };
 const colors=backgrounds[currentMap];
 const grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,colors[0]);grad.addColorStop(1,colors[1]);
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="#ffffff12";
 for(let x=0;x<W;x+=40){
 ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=0;y<H;y+=40){
 ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }
 if(currentMap==="space"){
 for(let i=0;i<35;i++){
 ctx.fillStyle="#ffffff";
 ctx.fillRect((i*83)%W,(i*47)%H,2,2);
 }
 }
}

function drawObject(o){
 ctx.save();
 ctx.translate(o.x,o.y);
 o.angle+=o.type==="saw"?.035:0;
 ctx.rotate(o.angle);
 const circle=(color,r)=>{
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
 };
 switch(o.type){
 case "bumper":circle("#278dff",27);circle("#9ce5ff",13);break;
 case "spring":circle("#23ca83",27);ctx.fillStyle="white";ctx.font="bold 27px Arial";ctx.textAlign="center";ctx.fillText("↟",0,9);break;
 case "spikes":
 ctx.fillStyle="#f04453";ctx.beginPath();
 for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*(i%2?19:34),Math.sin(a)*(i%2?19:34));}
 ctx.closePath();ctx.fill();break;
 case "wall":ctx.fillStyle="#8999b1";ctx.fillRect(-29,-32,58,64);ctx.strokeStyle="#d3dfec";ctx.strokeRect(-29,-32,58,64);break;
 case "saw":
 circle("#bbc9d7",27);circle("#34445d",8);
 ctx.strokeStyle="#e7efff";ctx.lineWidth=5;
 for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-25);ctx.stroke();}
 break;
 case "cannon":circle("#f49d33",27);ctx.fillStyle="#262b39";ctx.fillRect(-7,-36,14,38);break;
 case "mine":circle("#ff493b",25);ctx.fillStyle="white";ctx.font="bold 25px Arial";ctx.textAlign="center";ctx.fillText("!",0,9);break;
 case "trampoline":
 ctx.fillStyle="#ad54f3";ctx.fillRect(-33,-7,66,14);
 ctx.strokeStyle="#e9b8ff";ctx.lineWidth=4;ctx.strokeRect(-33,-7,66,14);break;
 case "crusher":ctx.fillStyle="#9ca9b9";ctx.fillRect(-30,-25,60,50);ctx.fillStyle="#ffba36";ctx.fillRect(-30,-25,60,8);break;
 case "laser":ctx.fillStyle="#ff364e";ctx.shadowColor="#ff243e";ctx.shadowBlur=15;ctx.fillRect(-35,-4,70,8);break;
 case "fan":circle("#53b5db",27);ctx.fillStyle="white";ctx.font="25px Arial";ctx.textAlign="center";ctx.fillText("✦",0,9);break;
 case "barrel":circle("#b46b38",26);ctx.fillStyle="#252d3c";ctx.fillRect(-21,-5,42,10);break;
 case "magnet":circle("#d54c6b",25);ctx.fillStyle="white";ctx.font="bold 27px Arial";ctx.textAlign="center";ctx.fillText("U",0,9);break;
 case "fire":circle("#ef6d23",25);ctx.fillStyle="#ffdd43";ctx.font="25px Arial";ctx.textAlign="center";ctx.fillText("🔥",0,9);break;
 case "teleporter":circle("#9d62ff",28);circle("#1a163e",16);break;
 }
 ctx.restore();
}

function drawPeople(){
 for(const person of people){
 const p=person.p;
 ctx.lineWidth=9;ctx.lineCap="round";ctx.strokeStyle=person.c;
 for(const l of person.links){
 ctx.beginPath();ctx.moveTo(p[l[0]].x,p[l[0]].y);ctx.lineTo(p[l[1]].x,p[l[1]].y);ctx.stroke();
 }
 for(let i=0;i<p.length;i++){
 const b=p[i];
 ctx.fillStyle=person.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
 if(i===0){
 ctx.fillStyle="#1c2230";
 ctx.beginPath();ctx.arc(b.x-4,b.y-2,2,0,7);ctx.fill();
 ctx.beginPath();ctx.arc(b.x+4,b.y-2,2,0,7);ctx.fill();
 }
 }
 }
}

function drawParticles(){
 for(const p of particles){
 ctx.globalAlpha=Math.max(0,p.life/35);
 ctx.fillStyle="#ffcf47";
 ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();
 if(p.amount){
 ctx.font="bold 14px Arial";ctx.fillText("+"+p.amount,p.x+6,p.y-10);
 }
 ctx.globalAlpha=1;
 }
}

function loop(){
 frame++;
 if(running){
 for(const person of people)physicsPerson(person);
 }
 for(const p of particles){
 p.life--;
 p.x+=p.vx||0;p.y+=p.vy||-.5;
 }
 particles=particles.filter(p=>p.life>0);
 drawBackground();
 objects.forEach(drawObject);
 drawPeople();
 drawParticles();
 requestAnimationFrame(loop);
}
loop();

// Menus
function openPanel(which){
 running=false;
 const panel=document.getElementById("panel");
 const content=document.getElementById("panelContent");
 panel.style.display="block";
 let html="";
 if(which==="shop"){
 html="<h2>🛒 TRAP SHOP</h2><div class='items'>";
 traps.forEach(t=>{
 const has=owned.includes(t[0]);
 html+=`<div class="item"><b>${t[1]} ${t[2]}</b><p>${t[4]}</p><p>Price: ${t[3]} coins</p><button onclick="buyTrap('${t[0]}',${t[3]})">${has?"OWNED":"BUY"}</button><button onclick="selectTrap('${t[0]}')">SELECT</button></div>`;
 });
 html+="</div>";
 }
 if(which==="maps"){
 html="<h2>🌍 MAP SELECT</h2><div class='items'>";
 maps.forEach((m,i)=>{
 const cost=i*100;
 html+=`<div class="item"><b>${m[1]} ${m[2]}</b><p>${m[2]} arena</p><p>${i===0?"FREE":cost+" coins"}</p><button onclick="buyMap('${m[0]}',${cost})">${currentMap===m[0]?"SELECTED":"UNLOCK / SELECT"}</button></div>`;
 });
 html+="</div>";
 }
 if(which==="characters"){
 html="<h2>🧍 CHARACTERS</h2><div class='items'>";
 characters.forEach((c,i)=>{
 const has=ownedCharacters.includes(i);
 html+=`<div class="item"><b>${c[1]} ${c[0]}</b><p>${i===0?"Your original ragdoll":"A new ragdoll look"}</p><p>${i===0?"FREE":c[2]+" coins"}</p><button onclick="buyCharacter(${i},${c[2]})">${has?"OWNED":"BUY"}</button><button onclick="selectCharacter(${i})">USE</button></div>`;
 });
 html+="</div>";
 }
 if(which==="missions"){
 const missions=[
 ["First smash","Get 5 collisions",totalHits>=5,50],
 ["Coin collector","Earn 100 coins",totalCoins>=100,100],
 ["Chaos creator","Place 10 traps",objects.length>=10,100],
 ["Trap master","Own 8 traps",owned.length>=8,200],
 ["Map explorer","Unlock the factory",currentMap!=="warehouse",100]
 ];
 html="<h2>🎯 MISSIONS</h2><div class='items'>";
 missions.forEach((m,i)=>{
 const done=completed[i];
 html+=`<div class="item"><b>${m[0]}</b><p>${m[1]}</p><p>${done?"COMPLETED":m[2]?"READY TO CLAIM":"IN PROGRESS"}</p><button onclick="claimMission(${i},${m[3]},${m[2]})">${done?"CLAIMED":"CLAIM REWARD"}</button></div>`;
 });
 html+="</div>";
 }
 if(which==="upgrades"){
 html="<h2>⬆ UPGRADES</h2><div class='items'>";
 html+=`<div class="item"><b>💰 Coin multiplier</b><p>Current multiplier: ${power}x</p><p>Upgrade: 250 coins</p><button onclick="upgradePower()">UPGRADE</button></div>`;
 html+=`<div class="item"><b>💥 Bigger rewards</b><p>Earn more from every collision.</p><p>Included in multiplier</p></div>`;
 html+="</div>";
 }
 if(which==="achievements"){
 html="<h2>🏆 ACHIEVEMENTS</h2><div class='items'>";
 const list=[
 ["First blood",totalHits>=1],
 ["Getting started",totalHits>=10],
 ["Money maker",totalCoins>=250],
 ["Trap collector",owned.length>=10],
 ["Character collector",ownedCharacters.length>=3],
 ["Chaos legend",totalHits>=100]
 ];
 list.forEach(a=>html+=`<div class="item"><b>${a[0]}</b><p>${a[1]?"🏆 UNLOCKED":"🔒 LOCKED"}</p></div>`);
 html+="</div>";
 }
 content.innerHTML=html;
}

function closePanel(){
 document.getElementById("panel").style.display="none";
}

function buyTrap(type,cost){
 if(owned.includes(type)){statusEl.textContent="You already own this trap!";return;}
 if(coins<cost){statusEl.textContent="Not enough coins!";return;}
 coins-=cost;owned.push(type);updateMoney();
 statusEl.textContent="New trap unlocked!";
 openPanel("shop");
}

function selectTrap(type){
 if(!owned.includes(type)){statusEl.textContent="Buy this trap first!";return;}
 selected=type;
 closePanel();
 setMode("build");
 statusEl.textContent="Selected "+type+". Tap arena to place it.";
}

function buyMap(map,cost){
 if(coins<cost&&map!==currentMap){
 statusEl.textContent="Not enough coins!";return;
 }
 const index=maps.findIndex(m=>m[0]===map);
 const key="map_"+map;
 let unlocked=localStorage.getItem(key)==="yes"||index===0;
 if(!unlocked){
 if(coins<cost)return;
 coins-=cost;localStorage.setItem(key,"yes");
 }
 currentMap=map;updateMoney();save();openPanel("maps");
}

function buyCharacter(i,cost){
 if(ownedCharacters.includes(i))return;
 if(coins<cost){statusEl.textContent="Not enough coins!";return;}
 coins-=cost;ownedCharacters.push(i);updateMoney();
 openPanel("characters");
}

function selectCharacter(i){
 if(!ownedCharacters.includes(i))return;
 character=i;save();closePanel();
 statusEl.textContent="Character selected!";
}

function upgradePower(){
 if(coins<250){statusEl.textContent="You need 250 coins!";return;}
 coins-=250;power=Math.min(5,power+1);
 updateMoney();openPanel("upgrades");
}

function claimMission(i,reward,ready){
 if(completed[i])return;
 const checks=[
 totalHits>=5,totalCoins>=100,objects.length>=10,
 owned.length>=8,currentMap!=="warehouse"
 ];
 if(!checks[i]){
 statusEl.textContent="Mission not completed yet!";
 return;
 }
 completed[i]=true;coins+=reward;updateMoney();
 openPanel("missions");
}

function checkAchievements(){
 if(totalHits>=1)achievements.first=true;
 if(totalHits>=10)achievements.ten=true;
 if(totalCoins>=250)achievements.money=true;
 save();
}

// Keyboard support for testing
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closePanel();
 if(e.key===" "){e.preventDefault();running=!running;}
 if(e.key==="r")reset();
});
</script>
</body>
</html>
